name: Apply native Hearth UI
on:
  push:
    branches: [release/codex-claude-compat]
    paths: [.github/workflows/apply-native-ui.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/codex-claude-compat
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify source hashes and apply reviewed native UI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,urllib.request
          ids=['e162637de6daf1b53e0b4d1a39b2480ccbe95ab2','07492621d0ff99bff5a840abc9aa27f7412a2939']
          chunks=[]
          for sha in ids:
              req=urllib.request.Request('https://api.github.com/repos/eidolonofficial/Hearth/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as r: data=json.load(r)
              chunks.append(base64.b64decode(data['content']))
          compressed=base64.b64decode(b''.join(chunks),validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='9e741e865a6953fe275c935557bbe41dc7ead66dfc234d5703740f8995e81194'
          changes=json.loads(lzma.decompress(compressed))
          for change in changes:
              p=pathlib.Path(change['path'])
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              assert not p.is_symlink()
              actual=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              assert actual==change['old'], 'Source changed: '+str(p)
          for change in changes:
              p=pathlib.Path(change['path'])
              if change['content'] is None: p.unlink()
              else:
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text(change['content'],encoding='utf-8',newline='\n')
                  p.chmod(change['mode'])
          PY
      - name: Validate common code before native runner tests
        run: |
          mkdir -p evidence
          set -o pipefail
          node --test tests/*.test.mjs 2>&1 | tee evidence/ui-tests.txt
          node --check macos/HearthWindow.js
          bash -n macos/Hearth.app/Contents/MacOS/Hearth
      - name: Commit native UI only to review branch
        run: |
          git rm .github/workflows/apply-native-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github AGENTS.md README.md 'Start Agents.cmd' 'Start Here.cmd' gui macos scripts tests
          git commit -m 'feat: make Hearth a native graphical home for Claude and Codex'
          git push origin HEAD:refs/heads/release/codex-claude-compat
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=tar HEAD > evidence/source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-ui-source
          path: evidence/
          retention-days: 7
