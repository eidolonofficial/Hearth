name: Prepare reviewed distribution
on:
  push:
    branches: [ci/github-verification-20260909]
    paths: [.ci/promote-reviewed.mjs, .ci/reviewed-candidate-hashes.json, .github/workflows/promote-reviewed.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/ci/github-verification-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: eidolonofficial/eidolon
          ref: 54ded26e23b731c02eb5156d1304aa343c3ce0b1
          path: .ci-source/eidolon
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: eidolonofficial/eidolon-setup
          ref: 3e96e7119fd9778165063cdb0569c9b7a5891776
          path: .ci-source/setup
          persist-credentials: false
      - name: Materialize the exact reviewed candidate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-evidence
          node .ci/promote-reviewed.mjs | tee .ci-evidence/promotion.txt
          git diff --exit-code -- .github
      - name: Gate generated files before committing them
        shell: bash
        run: |
          node --test --test-reporter=tap tests/*.test.mjs > .ci-evidence/hearth.tap
          (cd skills/eidolon && node --test --test-reporter=tap hooks/*.test.mjs scripts/*.test.mjs) > .ci-evidence/eidolon.tap
          (cd skills/setup && node --test --test-reporter=tap tests/*.test.mjs) > .ci-evidence/setup.tap
          node --test --test-reporter=tap scripts/generator-regression.test.mjs > .ci-evidence/generator.tap
          (cd skills/eidolon && node scripts/selfcheck.mjs && node scripts/eidolon-audit.mjs) > .ci-evidence/audit.txt
          node scripts/sync-bundles.mjs --check
      - name: Commit only the approved candidate paths on the review branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'ci/github-verification-20260909'
          git diff --exit-code -- .github assets installer/index.html installer/styles.css
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .ci/prepare-integration.mjs .gitattributes .gitignore README.md 'Start Agents.cmd' gui/HearthCore.ps1 installer/app.js 'macos/Start Agents.command' macos/hearth-core.sh scripts/hearth-ui.mjs scripts/sync-bundles.mjs scripts/welcome.mjs skills tests/hearth-ui.test.mjs vendor-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: commit the reviewed distribution and sealed bundle'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          git rev-parse HEAD > .ci-evidence/commit.txt
          git archive --format=tar HEAD > .ci-evidence/source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prepared-reviewed-distribution
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
