name: Hearth compatibility
on:
  push:
    branches: [main, release/codex-claude-compat, ci/github-verification-20260909]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: eidolonofficial/eidolon
          ref: 54ded26e23b731c02eb5156d1304aa343c3ce0b1
          path: .ci-source/eidolon
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: eidolonofficial/eidolon-setup
          ref: 3e96e7119fd9778165063cdb0569c9b7a5891776
          path: .ci-source/setup
          persist-credentials: false
      - name: Check committed bundles against reviewed source commits
        run: |
          node scripts/sync-bundles.mjs --check
          node scripts/prepare-legacy.mjs
          git diff --exit-code -- gui/MainWindow.xaml gui/Hearth.ps1 'Start Here.cmd' macos/Hearth.app/Contents/MacOS/Hearth
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Installer, routing and bundled compatibility tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-evidence
          git rev-parse HEAD > .ci-evidence/commit.txt
          node --test tests/*.test.mjs skills/eidolon/hooks/codex-hook.test.mjs skills/eidolon/scripts/install.test.mjs skills/eidolon/scripts/rehost.test.mjs skills/eidolon/scripts/skill-router.test.mjs skills/setup/tests/*.test.mjs 2>&1 | tee .ci-evidence/compatibility.txt
          (cd skills/eidolon && node scripts/platform-refresh.mjs --check) 2>&1 | tee .ci-evidence/platform-freshness.txt
      - name: PowerShell 7 and Windows PowerShell 5.1 copy core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & pwsh -NoProfile -File ./tests/windows-core.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 copy-core test failed' }
          & powershell.exe -NoProfile -File ./tests/windows-core.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 copy-core test failed' }
      - name: POSIX copy core and shell syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n macos/hearth-core.sh
          bash -n 'macos/Start Agents.command'
          bash -n macos/Welcome.command
          bash -n macos/Hearth.app/Contents/MacOS/Hearth
          export HOME="$(mktemp -d)"
          trap 'rm -rf "$HOME"' EXIT
          source macos/hearth-core.sh
          hc_install_skills "$PWD"
          if hc_install_skills "$PWD"; then echo 'Unexpected unapproved replacement'; exit 1; fi
      - name: Full bundled suite and source archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          node --test skills/eidolon/hooks/*.test.mjs skills/eidolon/scripts/*.test.mjs 2>&1 | tee .ci-evidence/full-suite.txt
          (cd skills/eidolon && node scripts/selfcheck.mjs && node scripts/eidolon-audit.mjs) 2>&1 | tee .ci-evidence/audit.txt
          git archive --format=tar HEAD > .ci-evidence/source.tar
          cp vendor-lock.json .ci-evidence/
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hearth-${{ runner.os }}
          path: .ci-evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
