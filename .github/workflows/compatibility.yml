name: Hearth compatibility
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: eidolonofficial/eidolon
          ref: e8e586463e42c4828b8d1dd31fb60f3a932a7c10
          path: .ci-source/eidolon
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: eidolonofficial/eidolon-setup
          ref: 3255e07f00180b43936ffc86e72024613be64ce6
          path: .ci-source/setup
          persist-credentials: false
      - name: Check committed bundles against reviewed source commits
        run: node scripts/sync-bundles.mjs --check
      - name: novice door is Node-free
        run: grep -iw node welcome.ps1 macos/Welcome.command && exit 1 || true
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Hearth tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-evidence
          git rev-parse HEAD > .ci-evidence/commit.txt
          node --test tests/*.test.mjs 2>&1 | tee .ci-evidence/hearth.txt
      - name: Bundled Eidolon hooks and scripts suites
        shell: bash
        run: |
          set -o pipefail
          node --test "skills/eidolon/hooks/*.test.mjs" "skills/eidolon/scripts/*.test.mjs" 2>&1 | tee .ci-evidence/eidolon.txt
      - name: Bundled Setup suite
        shell: bash
        run: |
          set -o pipefail
          node --test skills/setup/tests/*.test.mjs 2>&1 | tee .ci-evidence/setup.txt
      - name: Selfcheck and audit
        shell: bash
        run: |
          set -o pipefail
          (cd skills/eidolon && node scripts/selfcheck.mjs && node scripts/eidolon-audit.mjs) 2>&1 | tee .ci-evidence/audit.txt
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hearth-${{ runner.os }}
          path: .ci-evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
